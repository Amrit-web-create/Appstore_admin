<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Amritbharadwaj Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F4ECD8;--cd:#FFFAEE;--k:#151515;--m:#6b6354;--ok:#1f8a4c;--bd:#c62828}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.45 Sora,system-ui,sans-serif;background:var(--bg);color:var(--k);padding-bottom:96px}
h1,h2,h3,b{font-weight:800}h1{font-size:22px}h2{font-size:19px;margin-bottom:12px}h3{margin:16px 0 8px}
.w{max-width:760px;margin:auto;padding:16px}.m{color:var(--m);font-size:12px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.c{background:var(--cd);border:2px solid var(--k);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--k);margin-bottom:12px}
.btn{border:2px solid var(--k);background:#fff;color:var(--k);border-radius:12px;padding:8px 12px;font:800 13px Sora,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--k);margin:2px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--k)}.btn.k{background:var(--k);color:var(--bg)}.btn.r{color:var(--bd)}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gr .c{margin:0}.gr b{font-size:26px;display:block}.gr i{font-size:18px;margin-bottom:6px}
.ic{width:46px;height:46px;border-radius:12px;border:2px solid var(--k);object-fit:cover;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.rw{display:flex;gap:10px;align-items:center}.fx{flex:1;min-width:0}.fx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border:2px solid var(--k);border-radius:8px;background:#fff;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--k)}.bar.s i{background:#c9b98f}
.tag{font-size:11px;font-weight:800;border:2px solid var(--k);border-radius:20px;padding:1px 8px;margin-left:6px}.tag.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.tag.dr{background:#fff}.tag.hi{background:var(--k);color:var(--bg)}
input,select,textarea{width:100%;border:2px solid var(--k);border-radius:12px;padding:10px;font:500 14px Sora,sans-serif;background:#fff;color:var(--k)}input[type=checkbox]{width:20px;height:20px;accent-color:#151515}
textarea{min-height:80px}.fl{display:block;font-weight:800;font-size:12px;margin-bottom:10px}.fl input,.fl select,.fl textarea{margin-top:4px;font-weight:500}
.ch{display:flex;gap:6px;overflow:auto;margin:10px 0}.ch .btn{white-space:nowrap}.ch .on{background:var(--k);color:var(--bg)}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;position:absolute;inset:0;z-index:2;cursor:pointer}.sw span{position:absolute;inset:0;border:2px solid var(--k);border-radius:20px;background:#fff}.sw span:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--k);transition:.2s}.sw input:checked+span{background:var(--ok)}.sw input:checked+span:after{left:23px;background:#fff}
.nv{position:fixed;bottom:0;left:0;right:0;background:var(--k);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nv button{background:none;border:0;color:#cfc7b2;font:800 11px Sora,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px}.nv i{font-size:18px}.nv .on{color:#fff}.nv .plus{background:var(--bg);color:var(--k);border-radius:12px}
.md{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}.md>div{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border:2px solid var(--k);border-radius:20px 20px 0 0;padding:16px}
.th{display:flex;gap:6px;flex-wrap:wrap}.th div{position:relative}.th img{width:64px;height:110px;object-fit:cover;border:2px solid var(--k);border-radius:10px}.th button{position:absolute;top:-6px;right:-6px;border:2px solid var(--k);background:#fff;border-radius:50%;width:22px;height:22px;font-weight:800;cursor:pointer}
.sp{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
#t{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:var(--k);color:#fff;padding:10px 18px;border-radius:12px;font-weight:800;z-index:50;transition:.3s}#t.on{transform:translate(-50%,0)}
.lg{max-width:380px;margin:12vh auto;padding:16px}.lg h1{font-size:28px;margin:6px 0 16px}
</style></head><body><div id="t"></div><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,setDoc,updateDoc,deleteDoc,writeBatch}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
import{Client,Account,Storage,ID}from"https://cdn.jsdelivr.net/npm/appwrite@16.0.2/+esm";
const FB={apiKey:"AIzaSyA-8Nkiy4AI_A7jaj6uwuH_tYpJzfbdVFY",authDomain:"appstore-4dc4d.firebaseapp.com",projectId:"appstore-4dc4d",storageBucket:"appstore-4dc4d.firebasestorage.app",messagingSenderId:"683110761928",appId:"1:683110761928:web:febf0152daefd0c84a6cfd"};
const EP="https://sgp.cloud.appwrite.io/v1",PID="6b06681b002d8685a22b",BK="media",NAME="Amritbharadwaj";
const fa=initializeApp(FB),auth=getAuth(fa),db=getFirestore(fa),ac=new Client().setEndpoint(EP).setProject(PID),acc=new Account(ac),st=new Storage(ac);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img=id=>`${EP}/storage/buckets/${BK}/files/${id}/view?project=${PID}`,num=n=>Number(n||0).toLocaleString("en-IN"),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const ico=a=>a.iconId?`<img class="ic" src="${img(a.iconId)}">`:`<div class="ic">${esc((a.name||"?")[0])}</div>`;
const tag=s=>`<span class="tag ${s=="published"?"ok":s=="hidden"?"hi":"dr"}">${s}</span>`;
let apps=[],V={},tab="home",q="",flt="all",sel=new Set(),ed=null;
const toast=m=>{const t=$("#t");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600)};
const liveData=v=>({liveVersionId:v.id,liveVersionName:v.versionName,liveUrl:v.githubUrl,liveSize:v.fileSize||"",liveLog:v.changelog||""});
const noLive={liveVersionId:"",liveVersionName:"",liveUrl:"",liveSize:"",liveLog:""};
const clean=o=>JSON.parse(JSON.stringify(o));
const close=()=>$("#md")?.remove();
const modal=h=>{close();const d=document.createElement("div");d.className="md";d.id="md";d.innerHTML=`<div>${h}</div>`;d.onclick=e=>e.target===d&&close();document.body.append(d)};
const f=(l,i,v="",t="text")=>`<label class="fl">${l}<input id="f_${i}" type="${t}" value="${esc(v)}"></label>`;
const g=i=>$("#f_"+i).value.trim();

function login(){$("#app").innerHTML=`<div class="lg"><div class="c"><i class="fa-solid fa-lock fa-2x"></i><h1>Admin login</h1>${f("Email","e","","email")}${f("Password","p","","password")}<button class="btn k" style="width:100%;padding:12px" onclick="A.login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button></div></div>`}
onAuthStateChanged(auth,async u=>{if(!u)return login();try{await acc.get();load()}catch{await signOut(auth);login()}});

async function load(){const s=await getDocs(collection(db,"apps"));apps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
await Promise.all(apps.map(async a=>{const v=await getDocs(collection(db,"apps",a.id,"versions"));V[a.id]=v.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.versionCode||0)-(x.versionCode||0))}));render()}
function render(){$("#app").innerHTML=`<div class="w"><div class="hd"><div><div class="m">Welcome, Admin</div><h1>${NAME} <i class="fa-solid fa-hand-peace"></i></h1></div><div><button class="btn" onclick="A.exp()" title="Backup"><i class="fa-solid fa-cloud-arrow-down"></i></button><button class="btn k" onclick="A.out()"><i class="fa-solid fa-right-from-bracket"></i></button></div></div>${{home,apps:list,bulk}[tab]()}</div>
<nav class="nv">${[["home","fa-chart-pie","Overview"],["apps","fa-grip","Apps"],["bulk","fa-layer-group","Bulk live"]].map(([k,i,l])=>`<button class="${tab==k?"on":""}" onclick="A.go('${k}')"><i class="fa-solid ${i}"></i>${l}</button>`).join("")}<button class="plus" onclick="A.edit()"><i class="fa-solid fa-plus"></i>New app</button></nav>`}

function home(){const t=k=>apps.reduce((s,a)=>s+(+a[k]||0),0),p=apps.filter(a=>a.status=="published").length,mx=Math.max(1,...apps.map(a=>Math.max(a.downloadReal||0,a.downloadShown||0)));
const S=[["fa-mobile-screen","Total apps",apps.length],["fa-circle-check","Published",p],["fa-pen-ruler","Draft / hidden",apps.length-p],["fa-download","Real downloads",num(t("downloadReal"))],["fa-eye","Shown on site",num(t("downloadShown"))],["fa-code-branch","Versions",Object.values(V).flat().length]];
return`<div class="gr">${S.map(([i,l,n])=>`<div class="c"><i class="fa-solid ${i}"></i><b>${n}</b><span class="m">${l}</span></div>`).join("")}</div><h3 style="margin-top:20px"><i class="fa-solid fa-ranking-star"></i> Downloads per app</h3>
${[...apps].sort((a,b)=>(b.downloadReal||0)-(a.downloadReal||0)).map(a=>`<div class="c"><div class="rw">${ico(a)}<div class="fx"><b>${esc(a.name)}</b><span class="m">Live: ${a.liveVersionName?"v"+esc(a.liveVersionName):"none"} ${tag(a.status)}</span></div></div>
<div class="sp" style="margin-top:8px"><b><i class="fa-solid fa-download"></i> ${num(a.downloadReal)}</b><span class="m">real</span></div><div class="bar"><i style="width:${(a.downloadReal||0)/mx*100}%"></i></div>
<div class="sp" style="margin-top:6px"><b><i class="fa-solid fa-eye"></i> ${num(a.downloadShown)}</b><span class="m">shown on site</span></div><div class="bar s"><i style="width:${(a.downloadShown||0)/mx*100}%"></i></div></div>`).join("")||`<div class="c">Abhi koi app nahi. <b>New app</b> dabao.</div>`}`}

function cards(){const l=apps.filter(a=>(flt=="all"||a.status==flt)&&(a.name||"").toLowerCase().includes(q.toLowerCase()));
return l.map(a=>{const lv=a.liveVersionName;return`<div class="c"><div class="rw"><input type="checkbox" ${sel.has(a.id)?"checked":""} onchange="A.pick('${a.id}')">${ico(a)}<div class="fx"><b>${esc(a.name)}</b><span class="m">/${esc(a.slug)} ${tag(a.status)}</span></div>
<label class="sw"><input type="checkbox" ${a.status=="published"?"checked":""} onchange="A.tog('${a.id}',this.checked)"><span></span></label></div>
<div class="sp m" style="margin:10px 0"><span><i class="fa-solid fa-code-branch"></i> ${lv?"v"+esc(lv):"no live version"}</span><span><i class="fa-solid fa-download"></i> ${num(a.downloadReal)} real</span><span><i class="fa-solid fa-eye"></i> ${num(a.downloadShown)} shown</span></div>
<button class="btn" onclick="A.edit('${a.id}')"><i class="fa-solid fa-pen"></i> Edit</button><button class="btn" onclick="A.ver('${a.id}')"><i class="fa-solid fa-code-branch"></i> Versions</button><button class="btn" onclick="A.cp('${esc(a.slug)}')"><i class="fa-solid fa-link"></i> Link</button><button class="btn r" onclick="A.del('${a.id}')"><i class="fa-solid fa-trash"></i></button></div>`}).join("")||`<div class="c">Koi app nahi mila.</div>`}
function list(){return`<input placeholder="Search app..." value="${esc(q)}" oninput="A.s(this.value)"><div class="ch">${["all","published","draft","hidden"].map(s=>`<button class="btn ${flt==s?"on":""}" onclick="A.f('${s}')">${s}</button>`).join("")}</div>
${sel.size?`<div class="c"><b>${sel.size} selected</b><br><button class="btn k" onclick="A.bs('published')"><i class="fa-solid fa-rocket"></i> Publish</button><button class="btn" onclick="A.bs('hidden')"><i class="fa-solid fa-eye-slash"></i> Hide</button><button class="btn" onclick="A.bs('draft')">Draft</button><button class="btn r" onclick="A.bdel()"><i class="fa-solid fa-trash"></i> Delete</button></div>`:""}<div id="lst">${cards()}</div>`}

function bulk(){const o=["published","draft","hidden"];return`<h2><i class="fa-solid fa-layer-group"></i> Bulk: version + status</h2><div class="c m">Har app ka version aur status chuno, phir ek baar <b>Apply all</b>.</div><div style="margin-bottom:10px"><button class="btn" onclick="A.all('published')">All → published</button><button class="btn" onclick="A.all('draft')">All → draft</button><button class="btn" onclick="A.all('hidden')">All → hidden</button></div>
${apps.map(a=>`<div class="c"><div class="rw">${ico(a)}<b class="fx">${esc(a.name)}</b></div><label class="fl" style="margin-top:10px">Live version<select data-v="${a.id}"><option value="">— none —</option>${(V[a.id]||[]).map(v=>`<option value="${v.id}" ${a.liveVersionId==v.id?"selected":""}>v${esc(v.versionName)}</option>`).join("")}</select></label><label class="fl" style="margin:0">Status<select data-s="${a.id}">${o.map(s=>`<option ${a.status==s?"selected":""}>${s}</option>`).join("")}</select></label></div>`).join("")}
<button class="btn k" style="width:100%;padding:13px" onclick="A.bulk()"><i class="fa-solid fa-check-double"></i> Apply all</button>`}

function editor(id){const a=id?{...apps.find(x=>x.id==id)}:{status:"draft",downloadShown:0,sortOrder:apps.length+1};a.screenshots=[...(a.screenshots||[])];ed={id,a,icon:null,shots:[],rm:[]};
modal(`<h2>${id?"Edit app":"New app"}</h2><label class="fl">Name<input id="f_name" value="${esc(a.name)}" oninput="${id?"":"$('#f_slug').value=A.sl(this.value)"}"></label>${f("Link name (slug)","slug",a.slug)}${f("Short description","shortDesc",a.shortDesc)}<label class="fl">Full description<textarea id="f_description">${esc(a.description)}</textarea></label>${f("Category","category",a.category)}
<label class="fl">App icon<input type="file" accept="image/*" onchange="A.ed.icon=this.files[0]"></label>${a.iconId?`<div class="rw" style="margin-bottom:10px">${ico(a)}<span class="m">Naya icon chuno to purana badal jayega</span></div>`:""}
<label class="fl">Screenshots (kai chun sakte ho)<input type="file" accept="image/*" multiple onchange="A.ed.shots=[...this.files]"></label><div class="th" id="th">${ths()}</div>
${f("Play Store link","playStoreUrl",a.playStoreUrl,"url")}${f("Privacy policy link","privacyUrl",a.privacyUrl,"url")}${f("Contact email","contactEmail",a.contactEmail,"email")}${f("Support email","supportEmail",a.supportEmail,"email")}
${f("Downloads jo site par dikhenge","downloadShown",a.downloadShown,"number")}<div class="m" style="margin:-6px 0 10px">Asli count: <b>${num(a.downloadReal)}</b> <button class="btn" onclick="$('#f_downloadShown').value=${a.downloadReal||0}">Shown = Real</button></div>
${f("Order number (chhota pehle)","sortOrder",a.sortOrder,"number")}<label class="fl">Status<select id="f_status">${["draft","published","hidden"].map(s=>`<option ${a.status==s?"selected":""}>${s}</option>`).join("")}</select></label>
<button class="btn k" id="sv" style="width:100%;padding:13px" onclick="A.save()"><i class="fa-solid fa-floppy-disk"></i> Save app</button><button class="btn" style="width:100%;margin-top:8px" onclick="A.close()">Cancel</button>`)}
const ths=()=>ed.a.screenshots.map((s,i)=>`<div><img src="${img(s)}"><button onclick="A.rs(${i})">×</button></div>`).join("");

function vers(id){const a=apps.find(x=>x.id==id);modal(`<h2>${esc(a.name)} · Versions</h2>${(V[id]||[]).map(v=>`<div class="c"><div class="sp"><b>v${esc(v.versionName)} ${a.liveVersionId==v.id?'<span class="tag ok">LIVE</span>':""}</b><span class="m">code ${v.versionCode||0} · ${esc(v.fileSize||"")}</span></div><div class="m" style="margin:6px 0;word-break:break-all">${esc(v.changelog||"")}</div><button class="btn k" onclick="A.live('${id}','${v.id}')">Make live</button><button class="btn r" onclick="A.dv('${id}','${v.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join("")||`<div class="c m">Abhi koi version nahi.</div>`}
<h3>Add version</h3>${f("Version name (1.2.0)","vn")}${f("Version code (12)","vc","","number")}${f("GitHub release APK link","vu","","url")}${f("File size (18 MB)","vs")}<label class="fl">What's new<textarea id="f_vl"></textarea></label><label class="fl"><span class="rw"><input type="checkbox" id="f_vk" style="width:20px"> Add karte hi live karo</span></label>
<button class="btn k" style="width:100%;padding:13px" onclick="A.addv('${id}')"><i class="fa-solid fa-plus"></i> Add version</button><button class="btn" style="width:100%;margin-top:8px" onclick="A.close()">Close</button>`)}

const A=window.A={ed:null,close,sl:slug,go:t=>{tab=t;render()},s:v=>{q=v;$("#lst").innerHTML=cards()},f:s=>{flt=s;render()},
 async login(){try{try{await acc.deleteSession("current")}catch{}await acc.createEmailPasswordSession(g("e"),g("p"));await signInWithEmailAndPassword(auth,g("e"),g("p"))}catch(e){toast("Login fail: "+e.message)}},
 async out(){try{await acc.deleteSession("current")}catch{}await signOut(auth)},
 pick:id=>{sel.has(id)?sel.delete(id):sel.add(id);render()},
 async tog(id,on){await updateDoc(doc(db,"apps",id),{status:on?"published":"draft"});toast(on?"Published":"Moved to draft");load()},
 async bs(s){const b=writeBatch(db);sel.forEach(id=>b.update(doc(db,"apps",id),{status:s}));await b.commit();toast(sel.size+" apps → "+s);sel.clear();load()},
 async bdel(){if(!confirm(sel.size+" apps delete karein?"))return;for(const id of sel)await A.rm(id);sel.clear();load();toast("Deleted")},
 async rm(id){const a=apps.find(x=>x.id==id);for(const v of V[id]||[])await deleteDoc(doc(db,"apps",id,"versions",v.id));for(const fid of [a.iconId,...(a.screenshots||[])])if(fid)st.deleteFile(BK,fid).catch(()=>{});await deleteDoc(doc(db,"apps",id))},
 async del(id){if(confirm("Ye app, uske versions aur images delete ho jayenge. Pakka?")){await A.rm(id);toast("Deleted");load()}},
 cp(s){let b=localStorage.getItem("base")||prompt("App store site ka URL (jaise https://mystore.pages.dev)");if(!b)return;b=b.replace(/\/$/,"");localStorage.setItem("base",b);navigator.clipboard.writeText(b+"/app/"+s);toast("Link copy ho gaya")},
 edit(id){editor(id);A.ed=ed},rs(i){ed.rm.push(ed.a.screenshots.splice(i,1)[0]);$("#th").innerHTML=ths()},
 async save(){const a=ed.a;["name","slug","shortDesc","description","category","playStoreUrl","privacyUrl","contactEmail","supportEmail","status"].forEach(k=>a[k]=g(k));a.downloadShown=+g("downloadShown")||0;a.sortOrder=+g("sortOrder")||0;
  if(!a.name)return toast("Name likho");a.slug=slug(a.slug||a.name);if(apps.some(x=>x.slug==a.slug&&x.id!=ed.id))return toast("Ye slug pehle se hai");
  const b=$("#sv");b.disabled=true;b.textContent="Saving...";
  try{if(ed.icon){const o=a.iconId;a.iconId=(await st.createFile(BK,ID.unique(),ed.icon)).$id;o&&st.deleteFile(BK,o).catch(()=>{})}
   for(const x of ed.shots)a.screenshots.push((await st.createFile(BK,ID.unique(),x)).$id);
   ed.rm.forEach(x=>st.deleteFile(BK,x).catch(()=>{}));
   const{id:_,...d}=a;if(!ed.id){d.downloadReal=0;Object.assign(d,noLive)}
   await setDoc(ed.id?doc(db,"apps",ed.id):doc(collection(db,"apps")),clean(d),{merge:true});close();toast("Saved");load()}catch(e){toast(e.message);b.disabled=false;b.textContent="Save app"}},
 ver:id=>vers(id),
 async live(id,vid){await updateDoc(doc(db,"apps",id),liveData(V[id].find(v=>v.id==vid)));await load();vers(id);toast("Version live ho gaya")},
 async dv(id,vid){if(!confirm("Version delete?"))return;const a=apps.find(x=>x.id==id);await deleteDoc(doc(db,"apps",id,"versions",vid));if(a.liveVersionId==vid)await updateDoc(doc(db,"apps",id),noLive);await load();vers(id)},
 async addv(id){if(!g("vn")||!g("vu"))return toast("Version name aur GitHub link zaroori hai");const r=doc(collection(db,"apps",id,"versions")),d={versionName:g("vn"),versionCode:+g("vc")||0,githubUrl:g("vu"),fileSize:g("vs"),changelog:g("vl")};
  await setDoc(r,d);if($("#f_vk").checked)await updateDoc(doc(db,"apps",id),liveData({id:r.id,...d}));await load();vers(id);toast("Version added")},
 all(s){document.querySelectorAll("[data-s]").forEach(e=>e.value=s)},
 async bulk(){const b=writeBatch(db);let n=0;apps.forEach(a=>{const v=$(`[data-v="${a.id}"]`).value,s=$(`[data-s="${a.id}"]`).value,u={};if(v!=(a.liveVersionId||""))Object.assign(u,v?liveData(V[a.id].find(x=>x.id==v)):noLive);if(s!=a.status)u.status=s;if(Object.keys(u).length){b.update(doc(db,"apps",a.id),u);n++}});
  if(!n)return toast("Koi badlav nahi");await b.commit();await load();toast(n+" apps update ho gaye")},
 exp(){const u=URL.createObjectURL(new Blob([JSON.stringify({apps,versions:V},null,2)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="appstore-backup.json";l.click()}};
window.$=$;
</script></body></html>
